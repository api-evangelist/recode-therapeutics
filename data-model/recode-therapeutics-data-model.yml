summary: >-
  The entity-relationship graph of the ReCode Therapeutics content API, derived from the object
  shapes returned by the live surface and the `_links` relations WordPress emits. Identifiers are
  bare integers scoped per post type — there are no prefixed or globally unique IDs, which is the
  single most important thing a consumer must internalise.
identifiers:
  style: bare integer, auto-increment, shared sequence across post types
  prefixes: none
  detail: >-
    Posts, pages, media, events and values all draw IDs from ONE underlying sequence, but each is
    addressable only through its own collection route. ID 8252 is a post; GET /wp/v2/pages/8252
    returns 404 rest_post_invalid_id. Always carry the post type alongside the ID.
  stable_alternate_key: >-
    `slug` is the durable, human-meaningful key and is filterable via `?slug=`. Prefer it for
    anything persisted across runs.
  observed_ids:
    latest_post: 8252
    latest_page: 8240
    latest_media: 8238
    latest_event: 8042
    latest_value: 7546
entities:
  - name: Post
    collection: /wp/v2/posts
    count: 82
    description: >-
      Press releases, scientific publications, conference presentations and careers notices — the
      company's entire news stream.
    key_fields: [id, slug, title.rendered, content.rendered, excerpt.rendered, date_gmt, modified_gmt, link, status, author, featured_media, categories, tags]
    notes: >-
      content.rendered IS populated (5.7 KB on the most recent release), unlike many corporate
      WordPress installs where page-builder meta swallows the body.
  - name: Page
    collection: /wp/v2/pages
    count: 18
    description: >-
      The corporate site tree — Home, Our Purpose, Leadership, Careers & Culture, Science, Pipeline,
      Patients, Cystic Fibrosis, Primary Ciliary Dyskinesia, News, Partnering, Terms & Conditions,
      Privacy Policy, Cookie Policy.
    key_fields: [id, slug, title.rendered, content.rendered, parent, menu_order, link, modified_gmt]
    notes: Hierarchical. `parent` = 0 marks a top-level page; `menu_order` gives sibling ordering.
  - name: MediaItem
    collection: /wp/v2/media
    count: 305
    description: Logos, leadership headshots, conference posters and PDF decks.
    key_fields: [id, source_url, mime_type, media_type, alt_text, filename, filesize, media_details.sizes, post]
    notes: >-
      `post` back-references the object the attachment is attached to (nullable). `media_details.sizes`
      enumerates the generated image renditions.
  - name: Event
    collection: /wp/v2/events
    count: 50
    description: >-
      Site-specific custom post type registered into wp/v2 — conference appearances, investor
      presentations and scientific meetings.
    key_fields: [id, slug, title.rendered, content.rendered, date_gmt, link, featured_media]
    notes: Registers no taxonomies of its own. Appears in /wp/v2/search results under subtype `events`.
  - name: Value
    collection: /wp/v2/values
    count: 6
    description: Site-specific custom post type — the company's stated values, rendered on About / Careers & Culture.
    key_fields: [id, slug, title.rendered, content.rendered, excerpt.rendered]
  - name: Category
    collection: /wp/v2/categories
    count: 7
    description: Hierarchical taxonomy applied to Post only.
    key_fields: [id, slug, name, count, parent, taxonomy]
    terms:
      - {slug: press-releases, count: 47}
      - {slug: featured, count: 14}
      - {slug: presentations, count: 9}
      - {slug: publications, count: 9}
      - {slug: careers, count: 3}
      - {slug: team, count: 0}
      - {slug: uncategorized, count: 0}
  - name: Tag
    collection: /wp/v2/tags
    count: 11
    description: Flat taxonomy applied to Post only — predominantly scientific-conference labels.
    key_fields: [id, slug, name, count, taxonomy]
    terms:
      - {slug: featured, count: 6}
      - {slug: american-thoracic-society-ats, count: 4}
      - {slug: gordon-research-conferences, count: 2}
      - {slug: nacfc, count: 1}
      - {slug: north-american-cystic-fibrosis-conference, count: 1}
