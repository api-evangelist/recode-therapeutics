  - name: User
    collection: /wp/v2/users
    count: 5
    description: >-
      Site author records. PERSONAL DATA — documented, but deliberately excluded from every agent
      skill in this repository and never enumerated here. See the x-personal-data annotation on
      listUsers in the OpenAPI.
    key_fields: [id, name, slug, description, link, avatar_urls]
  - name: SearchResult
    collection: /wp/v2/search
    description: >-
      A lightweight projection across every REST-exposed post type. Not a stored entity — a view.
      Carries only id/title/url/type/subtype; resolve `subtype` to the owning collection to fetch
      the full record.
  - name: TypeDescriptor
    collection: /wp/v2/types
    count: 21
    description: Metadata about each registered post type — the self-describing layer of the API.
  - name: TaxonomyDescriptor
    collection: /wp/v2/taxonomies
    count: 6
relationships:
  - from: Post
    to: User
    type: belongs_to
    via: author
    resolve: GET /wp/v2/users/{author}
    link_rel: author
    note: Traverses into personal data. Use _fields to project `author` away when it is not needed.
  - from: Post
    to: MediaItem
    type: has_one
    via: featured_media
    resolve: GET /wp/v2/media/{featured_media}
    link_rel: wp:featuredmedia
    note: 0 means no featured image.
  - from: Post
    to: Category
    type: has_many
    via: categories
    resolve: GET /wp/v2/categories?include={ids}
    link_rel: wp:term
  - from: Post
    to: Tag
    type: has_many
    via: tags
    resolve: GET /wp/v2/tags?include={ids}
    link_rel: wp:term
  - from: Page
    to: Page
    type: belongs_to
    via: parent
    resolve: GET /wp/v2/pages/{parent}
    note: Self-referencing hierarchy. parent = 0 is the root sentinel, not a real page ID.
  - from: Page
    to: MediaItem
    type: has_one
    via: featured_media
  - from: Page
    to: User
    type: belongs_to
    via: author
  - from: MediaItem
    to: Post
    type: belongs_to
    via: post
    resolve: GET /wp/v2/posts/{post} or /wp/v2/pages/{post}
    note: >-
      Nullable, and NOT type-discriminated — the ID may belong to a post, a page, or a custom post
      type. Resolve by trying the owning collection, or read the `_links.about` relation instead.
  - from: Event
    to: MediaItem
    type: has_one
    via: featured_media
  - from: Category
    to: Category
    type: belongs_to
    via: parent
    note: Hierarchical taxonomy; parent = 0 for a top-level term.
  - from: SearchResult
    to: Post|Page|Event|Value
    type: belongs_to
    via: id + subtype
    note: >-
      `subtype` is the discriminator that tells you which collection to resolve `id` against. Without
      it the bare id is ambiguous.
traversal_notes:
  - >-
    `_embed` collapses the author / featured-media / term hops into an `_embedded` block on the
    parent object, turning an N+1 walk into one request. Prefer it for any graph traversal.
  - >-
    `_links.curies` maps the `wp:` prefix used by wp:featuredmedia, wp:term and wp:attachment. The
    relations are discoverable at runtime; nothing needs to be hard-coded.
  - >-
    Taxonomy counts and post counts disagree in one place worth knowing: category counts sum to more
    than 82 because `featured` overlaps the other categories.
