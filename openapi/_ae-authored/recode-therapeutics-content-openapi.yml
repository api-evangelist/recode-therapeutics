openapi: 3.1.0
info:
  title: ReCode Therapeutics Content API
  version: '1.0.0'
  summary: The anonymously readable WordPress REST content API behind recodetx.com.
  description: >-
    ReCode Therapeutics runs no developer program and markets no product API. The only
    machine-readable contract reachable from the public internet without credentials is the
    WordPress REST API registered at https://recodetx.com/wp-json/, which the site publishes as a
    consequence of running WordPress on WP Engine behind Cloudflare.


    This document is DERIVED by the API Evangelist enrichment pipeline from the route index the
    site itself publishes at https://recodetx.com/wp-json/ (376 routes across 16 namespaces) and
    was verified against live anonymous responses on 2026-08-05. **Only operations that actually
    returned data without credentials are modelled here.** Everything write-side (POST/PUT/PATCH/
    DELETE on every collection), and the administrative namespaces the site also registers
    (`aioseo/v1`, `elementor/v1`, `elementor-pro/v1`, `elementor-ai/v1`, `redirection/v1`,
    `wpe_sign_on_plugin/v1`, `wp-site-health/v1`, `wp-block-editor/v1`, `wp-abilities/v1`), return
    401 `rest_forbidden` anonymously and are deliberately omitted rather than documented as
    capabilities.


    What the surface actually yields: 82 press releases and publications, 18 corporate pages, a
    305-item media library, two site-specific custom post types registered into `wp/v2`
    (`events`, 50 items — conference and investor appearances; and `values`, 6 items — the
    company's stated values), the category and tag taxonomies, the registered type/status/taxonomy
    metadata, cross-content search, and the oEmbed 1.0 provider endpoint. Unlike many corporate
    WordPress installs, `content.rendered` IS populated on posts and pages here (5.7 KB on the
    most recent press release, 53 KB on the home page), so the API returns real prose and not just
    identity metadata.


    Note on `/wp/v2/users`: the site leaves author enumeration open, and the collection returns 200
    with 5 author records anonymously. The operation is documented here because it is genuinely
    part of the observed surface, but API Evangelist deliberately packages no agent skill and no
    MCP tool against it, and records no individual from it. See `x-personal-data` on that operation.
  contact:
    name: ReCode Therapeutics
    url: https://recodetx.com/
  license:
    name: Not stated
    url: https://recodetx.com/terms-conditions/
  x-derived-from: https://recodetx.com/wp-json/
  x-verified: '2026-08-05'
  x-upstream-contract: https://developer.wordpress.org/rest-api/
servers:
  - url: https://recodetx.com/wp-json
    description: Production WordPress REST API for recodetx.com (WP Engine, fronted by Cloudflare).
tags:
  - name: discovery
    description: Route index and namespace metadata the install publishes about itself.
  - name: content
    description: Press releases, publications, corporate pages and site-specific custom post types.
  - name: media
    description: The media library — images, PDFs, posters and decks attached to the site.
  - name: taxonomy
    description: Categories, tags, and the registered type/status/taxonomy descriptors.
  - name: search
    description: Cross-content search across every REST-exposed post type.
  - name: people
    description: Author records. Personal data — read the x-personal-data annotation before use.
  - name: embed
    description: oEmbed 1.0 provider endpoint for recodetx.com URLs.
paths:
  /:
    get:
      operationId: getApiIndex
      tags: [discovery]
      summary: Get the API root index
      description: >-
        Returns the site's self-description plus the full registered route index — 376 routes
        across 16 namespaces — and the authentication methods the install advertises
        (application passwords, whose authorization endpoint is wp-admin only).
      responses:
        '200':
          description: The root discovery document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootIndex'
  /wp/v2:
    get:
      operationId: getNamespaceIndex
      tags: [discovery]
      summary: Get the wp/v2 namespace index
      description: Returns the routes registered under the wp/v2 namespace only.
      responses:
        '200':
          description: Namespace index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceIndex'
  /wp/v2/posts:
    get:
      operationId: listPosts
      tags: [content]
      summary: List press releases and publications
      description: >-
        82 published items at time of verification, spanning press releases (47), publications (9),
        presentations (9), featured items (14) and careers notices (3). Ordered by date descending
        by default.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/modifiedAfter'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/orderbyPost'
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/embed'
        - name: categories
          in: query
          description: Limit to posts assigned the given category term IDs.
          schema:
            type: array
            items:
              type: integer
        - name: tags
          in: query
          description: Limit to posts assigned the given tag term IDs.
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: A page of posts. Total count and page count are in the response headers.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
            X-WP-TotalPages:
              $ref: '#/components/headers/XWPTotalPages'
            Link:
              $ref: '#/components/headers/LinkPagination'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/InvalidParam'
  /wp/v2/posts/{id}:
    get:
      operationId: getPost
      tags: [content]
      summary: Get a single press release or publication
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/embed'
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/InvalidPostId'
  /wp/v2/pages:
    get:
      operationId: listPages
      tags: [content]
      summary: List corporate pages
      description: >-
        18 published pages — Home, About/Our Purpose, Leadership, Careers & Culture, Science,
        Pipeline, Patients, Cystic Fibrosis, Primary Ciliary Dyskinesia, News, Partnering, and the
        legal set (Terms & Conditions, Privacy Policy, Cookie Policy). Hierarchical: `parent` and
        `menu_order` describe the site tree.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/embed'
        - name: parent
          in: query
          description: Limit to children of the given page IDs.
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: A page of pages.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
            X-WP-TotalPages:
              $ref: '#/components/headers/XWPTotalPages'
            Link:
              $ref: '#/components/headers/LinkPagination'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/InvalidParam'
  /wp/v2/pages/{id}:
    get:
      operationId: getPage
      tags: [content]
      summary: Get a single corporate page
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/embed'
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          $ref: '#/components/responses/InvalidPostId'
  /wp/v2/events:
    get:
      operationId: listEvents
      tags: [content]
      summary: List events
      description: >-
        A site-specific custom post type registered into wp/v2. 50 items at verification — the
        conference appearances, investor presentations and scientific meetings the site lists.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: A page of events.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
            X-WP-TotalPages:
              $ref: '#/components/headers/XWPTotalPages'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomPost'
  /wp/v2/events/{id}:
    get:
      operationId: getEvent
      tags: [content]
      summary: Get a single event
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomPost'
        '404':
          $ref: '#/components/responses/InvalidPostId'
  /wp/v2/values:
    get:
      operationId: listValues
      tags: [content]
      summary: List company values
      description: >-
        A site-specific custom post type registered into wp/v2. 6 items — the company values
        rendered on the About / Careers & Culture pages.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: A page of values.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomPost'
  /wp/v2/values/{id}:
    get:
      operationId: getValue
      tags: [content]
      summary: Get a single company value
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomPost'
        '404':
          $ref: '#/components/responses/InvalidPostId'
  /wp/v2/media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List media library items
      description: >-
        305 attachments at verification — logos, leadership headshots, conference posters and PDF
        decks. `source_url` is the direct file URL; `media_details.sizes` carries the generated
        image renditions.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/fields'
        - name: media_type
          in: query
          description: Limit to a media type.
          schema:
            type: string
            enum: [image, video, text, application, audio, file]
        - name: mime_type
          in: query
          description: Limit to a MIME type, e.g. `application/pdf`.
          schema:
            type: string
      responses:
        '200':
          description: A page of media items.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
            X-WP-TotalPages:
              $ref: '#/components/headers/XWPTotalPages'
            Link:
              $ref: '#/components/headers/LinkPagination'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaItem'
  /wp/v2/media/{id}:
    get:
      operationId: getMediaItem
      tags: [media]
      summary: Get a single media item
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The media item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '404':
          $ref: '#/components/responses/InvalidPostId'
  /wp/v2/categories:
    get:
      operationId: listCategories
      tags: [taxonomy]
      summary: List post categories
      description: >-
        7 terms at verification — press-releases (47), featured (14), presentations (9),
        publications (9), careers (3), team (0), uncategorized (0).
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Category terms.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
  /wp/v2/categories/{id}:
    get:
      operationId: getCategory
      tags: [taxonomy]
      summary: Get a single category term
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The category term.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '404':
          $ref: '#/components/responses/InvalidTermId'
  /wp/v2/tags:
    get:
      operationId: listTags
      tags: [taxonomy]
      summary: List post tags
      description: >-
        11 terms at verification, mostly scientific-conference labels — american-thoracic-society-ats,
        nacfc, north-american-cystic-fibrosis-conference, gordon-research-conferences, pnas,
        journal-of-cystic-fibrosis, j-p-morgan, cilia2022, featured.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/slug'
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Tag terms.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
  /wp/v2/tags/{id}:
    get:
      operationId: getTag
      tags: [taxonomy]
      summary: Get a single tag term
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The tag term.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '404':
          $ref: '#/components/responses/InvalidTermId'
  /wp/v2/types:
    get:
      operationId: listTypes
      tags: [taxonomy]
      summary: List registered post types
      description: >-
        21 registered types. Beyond WordPress core, the install registers `events`, `values` and
        `portfolio` (site content) plus Elementor and Jupiter X builder types whose collections are
        either empty or 401 anonymously.
      responses:
        '200':
          description: A map of type slug to type descriptor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/TypeDescriptor'
  /wp/v2/types/{type}:
    get:
      operationId: getType
      tags: [taxonomy]
      summary: Get a single post-type descriptor
      parameters:
        - name: type
          in: path
          required: true
          description: The post-type slug, e.g. `post`, `page`, `events`, `values`.
          schema:
            type: string
      responses:
        '200':
          description: The type descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeDescriptor'
  /wp/v2/taxonomies:
    get:
      operationId: listTaxonomies
      tags: [taxonomy]
      summary: List registered taxonomies
      description: >-
        6 taxonomies — category, post_tag, nav_menu, wp_pattern_category, portfolio_category,
        portfolio_tag.
      responses:
        '200':
          description: A map of taxonomy slug to taxonomy descriptor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/TaxonomyDescriptor'
  /wp/v2/taxonomies/{taxonomy}:
    get:
      operationId: getTaxonomy
      tags: [taxonomy]
      summary: Get a single taxonomy descriptor
      parameters:
        - name: taxonomy
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The taxonomy descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyDescriptor'
  /wp/v2/statuses:
    get:
      operationId: listStatuses
      tags: [taxonomy]
      summary: List publicly visible post statuses
      description: >-
        Two statuses are exposed anonymously — `publish` and `acf-disabled`. Draft, pending,
        private, future and trash are not returned to an unauthenticated caller.
      responses:
        '200':
          description: A map of status slug to status descriptor.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/StatusDescriptor'
  /wp/v2/statuses/{status}:
    get:
      operationId: getStatus
      tags: [taxonomy]
      summary: Get a single status descriptor
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The status descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDescriptor'
  /wp/v2/search:
    get:
      operationId: searchContent
      tags: [search]
      summary: Search across every REST-exposed post type
      description: >-
        Returns lightweight hits (id, title, url, type, subtype) across posts and the custom types.
        A search for `mrna` returned 79 hits spanning the `post` and `events` subtypes at
        verification. Use `subtype` to constrain to one collection.
      parameters:
        - name: search
          in: query
          required: true
          description: The search term.
          schema:
            type: string
        - name: type
          in: query
          description: Object type to search — `post` (any post type) or `term`.
          schema:
            type: string
            enum: [post, term]
            default: post
        - name: subtype
          in: query
          description: Restrict to a registered subtype, e.g. `post`, `page`, `events`, `values`.
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Search hits.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
            X-WP-TotalPages:
              $ref: '#/components/headers/XWPTotalPages'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'
  /wp/v2/comments:
    get:
      operationId: listComments
      tags: [content]
      summary: List approved comments
      description: >-
        Registered and readable, but the collection is empty (X-WP-Total 0) — commenting is not
        used on this site. Documented so a consumer does not mistake an empty array for an error.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: An (empty) page of comments.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /wp/v2/users:
    get:
      operationId: listUsers
      tags: [people]
      summary: List site authors
      description: >-
        Returns 200 with 5 author records anonymously — author enumeration is left open on this
        install. Each record carries `id`, `name`, `slug`, `description`, `link`, `url` and Gravatar
        `avatar_urls`. Email addresses and roles are NOT exposed.
      x-personal-data:
        contains: true
        categories: [name, public-profile-url, avatar]
        note: >-
          This operation returns records about identifiable people. API Evangelist documents its
          existence because it is part of the observed public surface, but deliberately packages no
          agent skill and no MCP tool against it, and records no individual from it anywhere in this
          repository. Consumers in the EU/UK should treat any retrieval as personal-data processing.
        remediation: >-
          If ReCode Therapeutics does not intend author enumeration to be public, the `wp/v2/users`
          collection can be closed to unauthenticated callers with a `rest_authentication_errors` or
          `rest_endpoints` filter, or via the WP Engine / security-plugin setting that disables user
          enumeration.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Author records.
          headers:
            X-WP-Total:
              $ref: '#/components/headers/XWPTotal'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /wp/v2/users/{id}:
    get:
      operationId: getUser
      tags: [people]
      summary: Get a single author record
      x-personal-data:
        contains: true
        note: See the x-personal-data annotation on listUsers.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The author record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: No author with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oembed/1.0/embed:
    get:
      operationId: getOEmbed
      tags: [embed]
      summary: Get the oEmbed representation of a recodetx.com URL
      description: >-
        oEmbed 1.0 provider endpoint. Returns provider/author/title/thumbnail plus the embeddable
        iframe HTML for any URL on this site. Returns 404 `oembed_invalid_url` for URLs on any
        other host.
      parameters:
        - name: url
          in: query
          required: true
          description: The recodetx.com URL to embed.
          schema:
            type: string
            format: uri
        - name: format
          in: query
          schema:
            type: string
            enum: [json, xml]
            default: json
        - name: maxwidth
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The oEmbed document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OEmbed'
        '404':
          description: The URL is not on this site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: The object's unique numeric identifier.
      schema:
        type: integer
    page:
      name: page
      in: query
      description: 1-based page of the collection to return.
      schema:
        type: integer
        minimum: 1
        default: 1
    perPage:
      name: per_page
      in: query
      description: >-
        Items per page. Maximum 100 — a request for 101 is rejected with 400 `rest_invalid_param`
        (verified 2026-08-05).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    search:
      name: search
      in: query
      description: Limit results to those matching a string.
      schema:
        type: string
    slug:
      name: slug
      in: query
      description: Limit results to one or more slugs.
      schema:
        type: array
        items:
          type: string
    after:
      name: after
      in: query
      description: Limit to items published after a given ISO 8601 date.
      schema:
        type: string
        format: date-time
    before:
      name: before
      in: query
      description: Limit to items published before a given ISO 8601 date.
      schema:
        type: string
        format: date-time
    modifiedAfter:
      name: modified_after
      in: query
      description: Limit to items modified after a given ISO 8601 date — the incremental-sync cursor.
      schema:
        type: string
        format: date-time
    order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    orderbyPost:
      name: orderby
      in: query
      schema:
        type: string
        enum: [author, date, id, include, modified, parent, relevance, slug, title]
        default: date
    fields:
      name: _fields
      in: query
      description: >-
        Comma-separated sparse-fieldset projection, e.g. `_fields=id,slug,title`. Applies to every
        collection and item operation.
      schema:
        type: string
    embed:
      name: _embed
      in: query
      description: >-
        Inline the linked resources (author, featured media, terms) into `_embedded` instead of
        requiring follow-up requests.
      schema:
        type: boolean
  headers:
    XWPTotal:
      description: Total number of items in the unpaged collection.
      schema:
        type: integer
    XWPTotalPages:
      description: Total number of pages available at the current per_page.
      schema:
        type: integer
    LinkPagination:
      description: RFC 8288 Link header carrying `rel="next"` and `rel="prev"` page URLs.
      schema:
        type: string
  responses:
    InvalidParam:
      description: A query parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_invalid_param
            message: 'Invalid parameter(s): per_page'
            data:
              status: 400
    InvalidPostId:
      description: No object exists with that ID in this collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_post_invalid_id
            message: Invalid post ID.
            data:
              status: 404
    InvalidTermId:
      description: No term exists with that ID in this taxonomy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_term_invalid
            message: Term does not exist.
            data:
              status: 404
  schemas:
    RenderedText:
      type: object
      description: WordPress's rendered-text envelope.
      properties:
        rendered:
          type: string
          description: HTML as rendered by the site's filters.
        protected:
          type: boolean
      required: [rendered]
    Post:
      type: object
      description: A press release, publication, presentation or careers notice.
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
          description: Publication date in site local time (UTC-7 at verification).
        date_gmt:
          type: string
          format: date-time
        guid:
          $ref: '#/components/schemas/RenderedText'
        modified:
          type: string
          format: date-time
        modified_gmt:
          type: string
          format: date-time
        slug:
          type: string
        status:
          type: string
          enum: [publish]
        type:
          type: string
          enum: [post]
        link:
          type: string
          format: uri
        title:
          $ref: '#/components/schemas/RenderedText'
        content:
          $ref: '#/components/schemas/RenderedText'
        excerpt:
          $ref: '#/components/schemas/RenderedText'
        author:
          type: integer
          description: ID of the authoring user — resolvable via /wp/v2/users/{id}.
        featured_media:
          type: integer
          description: ID of the featured attachment — resolvable via /wp/v2/media/{id}.
        comment_status:
          type: string
        ping_status:
          type: string
        sticky:
          type: boolean
        template:
          type: string
        format:
          type: string
        categories:
          type: array
          items:
            type: integer
        tags:
          type: array
          items:
            type: integer
        class_list:
          type: array
          items:
            type: string
        meta:
          type: object
        acf:
          description: Advanced Custom Fields payload. Empty on the posts collection.
          type: object
        _links:
          $ref: '#/components/schemas/Links'
      required: [id, date, slug, status, type, link, title]
    Page:
      type: object
      description: A corporate page. Hierarchical — see `parent` and `menu_order`.
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
        date_gmt:
          type: string
          format: date-time
        guid:
          $ref: '#/components/schemas/RenderedText'
        modified:
          type: string
          format: date-time
        modified_gmt:
          type: string
          format: date-time
        slug:
          type: string
        status:
          type: string
        type:
          type: string
          enum: [page]
        link:
          type: string
          format: uri
        title:
          $ref: '#/components/schemas/RenderedText'
        content:
          $ref: '#/components/schemas/RenderedText'
        excerpt:
          $ref: '#/components/schemas/RenderedText'
        author:
          type: integer
        featured_media:
          type: integer
        parent:
          type: integer
          description: Parent page ID, or 0 for a top-level page.
        menu_order:
          type: integer
        template:
          type: string
        meta:
          type: object
        acf:
          type: object
        _links:
          $ref: '#/components/schemas/Links'
      required: [id, slug, type, link, title]
    CustomPost:
      type: object
      description: >-
        An item of one of the site-specific custom post types registered into wp/v2 — `events` or
        `values`. Same envelope as Post, minus the category/tag facets those types do not register.
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
        date_gmt:
          type: string
          format: date-time
        guid:
          $ref: '#/components/schemas/RenderedText'
        modified:
          type: string
          format: date-time
        slug:
          type: string
        status:
          type: string
        type:
          type: string
          enum: [events, values]
        link:
          type: string
          format: uri
        title:
          $ref: '#/components/schemas/RenderedText'
        content:
          $ref: '#/components/schemas/RenderedText'
        excerpt:
          $ref: '#/components/schemas/RenderedText'
        featured_media:
          type: integer
        class_list:
          type: array
          items:
            type: string
        acf:
          type: object
        _links:
          $ref: '#/components/schemas/Links'
      required: [id, type, link, title]
    MediaItem:
      type: object
      description: A media-library attachment.
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
        slug:
          type: string
        type:
          type: string
          enum: [attachment]
        link:
          type: string
          format: uri
        title:
          $ref: '#/components/schemas/RenderedText'
        caption:
          $ref: '#/components/schemas/RenderedText'
        description:
          $ref: '#/components/schemas/RenderedText'
        alt_text:
          type: string
        media_type:
          type: string
          enum: [image, file]
        mime_type:
          type: string
        filename:
          type: string
        filesize:
          type: integer
        source_url:
          type: string
          format: uri
          description: Direct URL to the stored file.
        media_details:
          type: object
          description: Dimensions plus the generated `sizes` renditions for images.
        post:
          type: integer
          nullable: true
          description: ID of the post or page this attachment is attached to.
        author:
          type: integer
        _links:
          $ref: '#/components/schemas/Links'
      required: [id, type, source_url, mime_type]
    Term:
      type: object
      description: A category or tag term.
      properties:
        id:
          type: integer
        count:
          type: integer
        description:
          type: string
        link:
          type: string
          format: uri
        name:
          type: string
        slug:
          type: string
        taxonomy:
          type: string
          enum: [category, post_tag]
        parent:
          type: integer
          description: Present on hierarchical taxonomies (category) only.
        meta:
          type: object
        _links:
          $ref: '#/components/schemas/Links'
      required: [id, name, slug, taxonomy]
    TypeDescriptor:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        hierarchical:
          type: boolean
        has_archive:
          oneOf:
            - type: boolean
            - type: string
        rest_base:
          type: string
        rest_namespace:
          type: string
        taxonomies:
          type: array
          items:
            type: string
        icon:
          type: string
          nullable: true
        _links:
          $ref: '#/components/schemas/Links'
    TaxonomyDescriptor:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        types:
          type: array
          items:
            type: string
        hierarchical:
          type: boolean
        rest_base:
          type: string
        rest_namespace:
          type: string
        _links:
          $ref: '#/components/schemas/Links'
    StatusDescriptor:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        public:
          type: boolean
        queryable:
          type: boolean
        date_floating:
          type: boolean
        _links:
          $ref: '#/components/schemas/Links'
    SearchResult:
      type: object
      description: A lightweight cross-type search hit.
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [post, term]
        subtype:
          type: string
          description: The registered post type the hit came from, e.g. `post`, `events`.
        _links:
          $ref: '#/components/schemas/Links'
      required: [id, title, url, type, subtype]
    User:
      type: object
      description: >-
        A site author. PERSONAL DATA — see the x-personal-data annotation on listUsers before
        retrieving or storing these records.
      properties:
        id:
          type: integer
        name:
          type: string
          description: The author's display name.
        slug:
          type: string
        description:
          type: string
        url:
          type: string
        link:
          type: string
          format: uri
        avatar_urls:
          type: object
          description: Gravatar URLs keyed by pixel size.
        meta:
          type: object
        _links:
          $ref: '#/components/schemas/Links'
      required: [id, name, slug]
    OEmbed:
      type: object
      properties:
        version:
          type: string
        provider_name:
          type: string
        provider_url:
          type: string
          format: uri
        author_name:
          type: string
        author_url:
          type: string
          format: uri
        title:
          type: string
        type:
          type: string
        width:
          type: integer
        height:
          type: integer
        html:
          type: string
        thumbnail_url:
          type: string
          format: uri
    RootIndex:
      type: object
      description: The site's self-description plus the full registered route index.
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        home:
          type: string
          format: uri
        gmt_offset:
          type: number
        timezone_string:
          type: string
        namespaces:
          type: array
          items:
            type: string
        authentication:
          type: object
          description: >-
            Advertises `application-passwords` with a wp-admin authorization endpoint. That is an
            interactive administrative flow, not a public API credential — no anonymous consumer can
            obtain one.
        routes:
          type: object
          additionalProperties:
            type: object
        _links:
          $ref: '#/components/schemas/Links'
    NamespaceIndex:
      type: object
      properties:
        namespace:
          type: string
        routes:
          type: object
          additionalProperties:
            type: object
        _links:
          $ref: '#/components/schemas/Links'
    Links:
      type: object
      description: >-
        HAL-style link relations. `self`, `collection`, `about`, `author`, `replies`,
        `wp:featuredmedia`, `wp:attachment`, `wp:term`, and `curies` mapping the `wp:` prefix.
      additionalProperties: true
    Error:
      type: object
      description: >-
        The WordPress REST error envelope. NOT RFC 9457 — the media type is `application/json`, not
        `application/problem+json`, and the field names are WordPress-specific.
      properties:
        code:
          type: string
          description: A machine-readable WordPress error slug, e.g. `rest_forbidden`.
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: integer
            params:
              type: object
            details:
              type: object
      required: [code, message]
