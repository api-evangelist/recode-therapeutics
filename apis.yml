    url: skills/_index.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://recodetx.com/wp-json/ — 376 routes across the namespaces oembed/1.0,
    wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, aioseo/v1, jupiterx-license, redirection/v1,
    complianz/v1, elementor/v1, monsterinsights/v1, elementor/v1/documents, elementor-ai/v1,
    elementor-pro/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1 — and
    verified against live anonymous responses on 2026-08-05. Only the 27 operations that returned
    data without credentials are modelled. Every write route and every administrative namespace
    returns 401 anonymously and is deliberately omitted rather than documented as a capability.
    Notably the install registers the WordPress Abilities API (`wp-abilities/v1`), an agent-facing
    capability registry, but /wp-json/wp-abilities/v1/abilities returns 401 rest_forbidden, so no
    agent surface is claimed here. /wp/v2/settings, /wp/v2/menu-items, /wp/v2/themes,
    /wp/v2/plugins, /wp/v2/templates, /wp/v2/block-patterns/patterns, /wp/v2/font-families and
    /wp/v2/elementor_library all return 401. /wp/v2/comments, /wp/v2/portfolio and /wp/v2/navigation
    return 200 with empty collections. One exposure is recorded rather than exploited:
    /wp/v2/users returns 200 with 5 identifiable author records anonymously; it is documented in the
    OpenAPI with an x-personal-data annotation and a remediation note, and is deliberately excluded
    from every packaged Agent Skill. ReCode Therapeutics publishes no developer documentation, no
    API reference, no getting-started guide, no status page, no changelog and no developer support
    channel, so no Documentation/APIReference/GettingStarted/DeveloperPortal/StatusPage/ChangeLog
    pointers are emitted; the humanURL above is the upstream WordPress REST handbook that defines
    the wp/v2 contract.
