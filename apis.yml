aid: recode-therapeutics
name: ReCode Therapeutics
description: >-
  ReCode Therapeutics is a clinical-stage genetic medicines company headquartered in Menlo Park,
  California with operations in Dallas, Texas, founded in 2015 out of research at UT Southwestern.
  Its Selective Organ Targeting (SORT) lipid nanoparticle platform is a delivery technology that
  directs mRNA and gene-correction payloads to organs, tissues and cells beyond the liver — the
  constraint that has limited genetic medicines to date — with redosing capability. Its lead
  programmes are RCT1100, an inhaled DNAI1 mRNA therapy for primary ciliary dyskinesia which has
  reported first-ever proof of activity in PCD patients, and RCT2100, an inhaled CFTR mRNA therapy
  for cystic fibrosis now in a Phase 2 combination trial with ivacaftor; both hold U.S. FDA Orphan
  Drug designation. The company collaborates with Intellia Therapeutics on CRISPR-based gene
  correction for cystic fibrosis, is funded in part by the Cystic Fibrosis Foundation, and has
  raised over $260 million in Series B financing. ReCode Therapeutics runs no developer program and
  publishes no product API, developer portal or API documentation; the only machine-readable
  surface reachable without credentials is the WordPress REST content API behind recodetx.com,
  catalogued here alongside the llms.txt the site publishes.
