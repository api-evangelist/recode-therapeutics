apis:
- aid: recode-therapeutics:recode-therapeutics-content-api
  name: ReCode Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind recodetx.com. It exposes 82 press releases,
    scientific publications and conference presentations; the 18 corporate pages (Our Purpose,
    Leadership, Careers & Culture, Science, Pipeline, Clinical Studies, Patients, Cystic Fibrosis,
    Primary Ciliary Dyskinesia, Partnering, News, Media Library and the legal set); a 305-item media
    library carrying the ATS conference posters and investor decks as PDFs; two site-specific custom
    post types registered into wp/v2 — `events` (50 conference and investor appearances) and
    `values` (6 stated company values); the category and tag taxonomies; the registered
    type/status/taxonomy descriptors; cross-content search; and the oEmbed 1.0 provider endpoint.
    Unlike many corporate WordPress installs, `content.rendered` IS populated on posts and pages
    here, so the API returns real prose rather than identity metadata alone. This is not a developer
    product ReCode Therapeutics markets — it is the site's own content surface, registered at
    /wp-json/ and verified to return data without credentials. The OpenAPI in this repository is
    derived from the published route index and models only the operations that actually answered
    anonymously.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://recodetx.com/wp-json
