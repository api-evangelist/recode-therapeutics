summary: >-
  ReCode Therapeutics publishes no API lifecycle commitments of any kind — no versioning policy, no
  deprecation policy, no sunset headers, no SLA, no status page and no changelog. This is expected:
  the company runs no developer program, and the content API catalogued here is an artifact of its
  WordPress install rather than a product it manages. Everything below records absence that was
  actually checked, not absence assumed.
versioning:
  policy_published: false
  scheme: path-namespace (`/wp-json/wp/v2/...`)
  current_version: wp/v2
  owner: WordPress core — not ReCode Therapeutics
  detail: >-
    The version segment tracks the WordPress REST API, which the company neither authors nor
    announces. A WordPress core upgrade, a plugin change, or a theme change can add, remove or
    alter routes with no notice and no version bump, because the site-specific custom post types
    (`events`, `values`, `portfolio`) are registered INTO the wp/v2 namespace rather than a
    namespace of their own.
  consumer_implication: >-
    Treat this contract as unversioned in practice. Re-read GET /wp-json/ before each run and
    compare the registered route set; do not assume last week's routes still exist.
